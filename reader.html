<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamWings | Storybook</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--ink:#4a2c20;--gold:#d99a45;--paper:#fff7e9;--paper2:#f5e6cd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff1df;font-family:Quicksand,sans-serif;background:radial-gradient(ellipse at 50% 20%,#68412e 0,#2b1b18 55%,#160f0e 100%)}
.navbar{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;background:#160f0e66}
.logo{display:flex;align-items:center;gap:11px;font:600 25px Fredoka;color:#ffc46e}.logo-icon{width:39px;height:39px;border-radius:13px;background:#68432e;display:grid;place-items:center}
.back-link{color:#ffe0b2;text-decoration:none;border:1px solid #b67a3c;border-radius:22px;padding:10px 17px;font-weight:700;font-size:13px}
main{width:min(1100px,94%);margin:38px auto 55px}.heading{text-align:center;margin-bottom:27px}.eyebrow{color:#f2b75e;font-size:11px;letter-spacing:3px;font-weight:700}.heading h1{font:600 clamp(30px,5vw,46px) Fredoka;margin:9px 0;color:#ffcf87}.heading p{color:#e4cbb4;margin:0}
.book-info{text-align:center;margin:0 auto 20px}.book-info h2{font:600 25px "Playfair Display",serif;margin:0 0 6px;color:#ffe8c8}.book-info p{margin:0;color:#d6bca5;font-size:13px}
.book-stage{perspective:1800px;width:min(850px,100%);margin:auto;position:relative;padding:15px 0 25px}
.open-book{position:relative;display:grid;grid-template-columns:1fr 1fr;height:520px;min-height:520px;max-height:520px;filter:drop-shadow(0 25px 25px #0007)}
.page{position:relative;height:520px;min-height:520px;max-height:520px;padding:clamp(25px,4vw,45px);background:linear-gradient(90deg,#ead7b9 0,#fff8eb 8%,#fff8eb 100%);color:var(--ink);overflow:hidden}
.page.left{border-radius:12px 0 0 12px;box-shadow:inset -14px 0 18px -18px #583b2b}
.page.right{border-radius:0 12px 12px 0;box-shadow:inset 14px 0 18px -18px #583b2b}
.page.right:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#d6bd98}
.page-content{position:relative;z-index:1;height:100%;max-height:100%;overflow-y:auto;padding:0 5px 30px 0;font:500 clamp(14px,1.55vw,16px)/1.85 "Playfair Display",serif;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:#d1ad7c transparent}
.page-content p{margin:0 0 17px}.illustration-page{display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#fff8eb,#f4e4ca)}
.illustration-page img[hidden]{display:none !important}.illustration-page img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border-radius:10px;box-shadow:0 8px 24px #5b3a2518}
.illustration-placeholder{max-width:280px;text-align:center;color:#b18e68;font:600 14px/1.8 Quicksand,sans-serif}
.illustration-placeholder i{display:block;font-size:38px;margin-bottom:12px;color:#d4b58c}
.page-number{position:absolute;bottom:19px;left:0;right:0;text-align:center;color:#a88a68;font:600 11px Quicksand}
.page-turn{position:absolute;z-index:5;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;pointer-events:none}
.page-turn.turning{animation:turnPage .72s cubic-bezier(.4,.1,.2,1)}
@keyframes turnPage{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
.page-turn-face{position:absolute;inset:0;background:linear-gradient(90deg,#e8d5b6,#fff8eb 15%,#fff8eb);backface-visibility:hidden;border-radius:0 12px 12px 0;box-shadow:0 0 20px #4a2c2033}
.page-turn-face.back{transform:rotateY(180deg);background:linear-gradient(90deg,#fff8eb,#f0dfc4)}
 .cover-art{height:520px;min-height:520px;max-height:520px;border-radius:12px;background:linear-gradient(145deg,#754a35 0%,#44291f 48%,#241613 100%);border:7px double #d9a65e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:0 22px 35px #0008;position:relative;overflow:hidden;transform-origin:left center;animation:closedBookReveal 1.15s cubic-bezier(.2,.75,.25,1) both}
.cover-art:before{content:"";position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,#1d100d99,#d9a65e55,#fff0);border-right:1px solid #f4d49a55;box-shadow:5px 0 12px #10090755}
.cover-art:after{content:"";position:absolute;top:-30%;left:-75%;width:45%;height:160%;transform:rotate(22deg);background:linear-gradient(90deg,transparent,#fff3,transparent);animation:coverShimmer 4.8s ease-in-out 1.1s infinite;pointer-events:none}
.cover-art img,.cover-art h2,.cover-art p{position:relative;z-index:1}
.cover-art img{width:min(190px,55%);height:240px;object-fit:cover;border-radius:7px;box-shadow:0 12px 24px #0008;margin-bottom:22px}
@keyframes closedBookReveal{0%{opacity:0;transform:perspective(1200px) rotateY(-24deg) translateY(22px) scale(.94);filter:brightness(.65)}65%{opacity:1;transform:perspective(1200px) rotateY(5deg) translateY(-4px) scale(1.015);filter:brightness(1.12)}100%{opacity:1;transform:perspective(1200px) rotateY(0) translateY(0) scale(1);filter:brightness(1)}}
@keyframes coverShimmer{0%,55%{left:-75%}85%,100%{left:140%}}
.reader-controls #startReading{animation:openButtonGlow 2.4s ease-in-out 1.1s infinite;box-shadow:0 0 0 0 #e9ad5655}
@keyframes openButtonGlow{0%,100%{box-shadow:0 0 0 0 #e9ad5600;transform:translateY(0)}50%{box-shadow:0 0 0 7px #e9ad5622;transform:translateY(-2px)}}
.cover-art h2{font:600 clamp(25px,4vw,38px) "Playfair Display",serif;color:#ffe0a9;margin:0 0 12px}.cover-art p{color:#eacba3}
.reader-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px auto 0}
.reader-controls button{border:1px solid #d7a45e;border-radius:25px;padding:12px 20px;background:#4a2d23;color:#ffe5bd;font:700 13px Quicksand;cursor:pointer;transition:.2s}
.reader-controls button.primary{background:linear-gradient(135deg,#e9ad56,#c87934);color:#321d13;border:0}
.reader-controls button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.reader-controls button:disabled{opacity:.35;cursor:not-allowed}\n#bookNarration{display:none}
.progress-wrap{width:min(420px,90%);margin:18px auto 0;color:#d9b99a;font-size:12px;text-align:center}
.progress-track{height:5px;background:#ffffff25;border-radius:8px;margin-top:8px;overflow:hidden}.progress-fill{height:100%;width:0;background:#eab15e;transition:width .3s}
.status{text-align:center;min-height:22px;color:#e9c69f;font-size:12px;margin-top:15px}
.story-video-wrap{width:min(850px,100%);margin:28px auto 0;padding:18px;border:1px solid #c89453;border-radius:22px;background:linear-gradient(145deg,#3b261f,#211512);box-shadow:0 18px 38px #0006}
.story-video-title{display:flex;align-items:center;gap:10px;color:#ffd18a;font:600 20px Fredoka;margin:0 0 13px}
.story-video-frame{overflow:hidden;border:5px solid #b77d43;border-radius:16px;background:#100c0b;box-shadow:inset 0 0 0 1px #f5d49b55}
.story-video-frame video{display:block;width:100%;max-height:480px;aspect-ratio:16/9;object-fit:contain;background:#080606}
.empty-story{max-width:600px;margin:35px auto;padding:30px;border:1px solid #b77b43;border-radius:18px;background:#38251f;text-align:center;line-height:1.8}
@media(max-width:650px){.navbar{height:65px;padding:0 4%}.logo{font-size:20px}.back-link{padding:8px 11px}.open-book{grid-template-columns:1fr;height:auto;min-height:0;max-height:none;gap:10px}.page.left{display:block;height:420px;min-height:420px;max-height:420px;border-radius:12px}.page.right{height:340px;min-height:340px;max-height:340px;border-radius:12px}.page.right:before{display:none}.page-turn{display:none}.cover-art{height:460px;min-height:460px;max-height:460px}.book-stage{padding:5px 0}.page{padding:30px 25px}}
@media(prefers-reduced-motion:reduce){.page-turn.turning{animation:none}.cover-art,.cover-art:after,.reader-controls #startReading{animation:none}}

/* Responsive fixed reader navigation */
.navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 3000;
    width: 100%;
    background: rgba(22,15,14,.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
main { padding-top: 76px; }
@media (max-width: 650px) {
    .navbar { height: auto; min-height: 68px; padding: 9px 4%; gap: 10px; }
    .logo { font-size: clamp(18px, 5vw, 22px); gap: 7px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 10px; }
    .back-link { padding: 8px 10px; font-size: 11px; white-space: nowrap; }
    main { padding-top: 76px; margin-top: 20px; }
    .heading h1 { font-size: clamp(27px, 8vw, 38px); }
    .heading p { font-size: 13px; line-height: 1.6; }
    .book-info h2 { font-size: 21px; }
    .open-book { grid-template-columns: minmax(0,1fr); height: auto; min-height: 0; max-height: none; }
    .page.left, .page.right { width: 100%; height: min(68vh, 430px); min-height: 320px; max-height: 430px; border-radius: 12px; }
    .page.left { display: block; }
    .page.right { margin-top: 12px; }
    .page.right:before { display: none; }
    .cover-art { height: min(68vh, 460px); min-height: 340px; max-height: 460px; }
    .page-turn { display: none; }
}
@media (max-width: 380px) {
    .navbar { padding-left: 3%; padding-right: 3%; }
    .logo { font-size: 17px; }
    .back-link { font-size: 10px; padding: 7px 8px; }
    .page { padding: 24px 18px; }
}

</style>
</head>
<body>
<header class="navbar"><div class="logo"><span class="logo-icon"><i class="fa-solid fa-book-open"></i></span>DreamWings</div><a href="library.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Library</a></header>
<main>
  <section class="heading"><div class="eyebrow"><i class="fa-solid fa-sparkles"></i> A MAGICAL READING JOURNEY</div><h1>Your Storybook</h1><p>Turn the pages and let your imagination fly ✨</p></section>
  <div id="loading" class="status">Opening your magical book…</div>
  <section id="reader" hidden>
    <div class="book-info"><h2 id="bookTitle"></h2><p id="bookAuthor"></p></div>
    <div class="book-stage">
      <div id="cover" class="cover-art"><img id="bookCover" alt="Book cover"><h2 id="coverTitle"></h2><p id="coverAuthor"></p></div>
      <div id="openBook" class="open-book" hidden>
        <article class="page left"><div class="page-content" id="leftText"></div><div class="page-number" id="leftNumber"></div></article>
        <article class="page right illustration-page">
          <img id="pageIllustration" alt="Illustration for this part of the story" hidden>
          <div id="illustrationPlaceholder" class="illustration-placeholder"><i class="fa-solid fa-wand-magic-sparkles"></i>Your story illustration will appear here</div>
          <div class="page-number" id="rightNumber"></div>
        </article>
        <div id="pageTurn" class="page-turn"><div class="page-turn-face"></div><div class="page-turn-face back"></div></div>
      </div>
    </div>
    <div class="reader-controls">
      <button id="startReading" class="primary"><i class="fa-solid fa-book-open"></i> Open book</button>
      <button id="prevPage" disabled hidden><i class="fa-solid fa-chevron-left"></i> Previous</button>
      <button id="nextPage" class="primary" disabled hidden>Next <i class="fa-solid fa-chevron-right"></i></button>
      <button id="playNarration" hidden><i class="fa-solid fa-volume-high"></i> Play my audio</button>
      <button id="pauseNarration" hidden><i class="fa-solid fa-pause"></i> Pause</button>
      <audio id="bookNarration" preload="none"></audio>
    </div>
    <section id="storyVideoSection" class="story-video-wrap" hidden>
      <h3 class="story-video-title"><i class="fa-solid fa-circle-play"></i> Watch the story</h3>
      <div class="story-video-frame"><video id="storyVideo" controls playsinline preload="metadata"></video></div>
    </section>
    <div class="progress-wrap"><span id="pageProgress">Cover</span><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></div>
    <p id="readerStatus" class="status" aria-live="polite"></p>
  </section>
</main>
<script type="module" src="./reader.js"></script>
<script src="language.js"></script>
</body>
</html>
